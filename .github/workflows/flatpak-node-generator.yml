name: Generate Flatpak Node Sources

on:
  push:
    branches:
      - develop
    paths:
      - "yarn.lock"
  workflow_dispatch:

jobs:
  generate-flatpak-node-sources:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          log_level: debug

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install flatpak-node-generator
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pipx install git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node

      - name: Generate Flatpak node sources
        run: |
          mkdir -p flatpak-sources
          flatpak-node-generator yarn yarn.lock --output flatpak/generated-sources.json

      - name: Commit generated sources to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update flatpak/generated-sources.json"
          file_pattern: "flatpak/generated-sources.json"
