name: Generate Flatpak Node Sources

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  generate-flatpak-node-sources:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          log_level: debug

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install flatpak-node-generator
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pipx install git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node

      - name: Generate Flatpak node sources
        run: |
          mkdir -p flatpak-sources
          flatpak-node-generator yarn yarn.lock --output flatpak-sources/generated-sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-node-sources
          path: flatpak-sources/generated-sources.json
