name: Build Flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Build the Flatpak app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          log_level: debug

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release manifest
        run: pnpm run generate-release-manifest

      - name: Generate node sources
        run: pnpm run generate-node-sources

      - name: Build flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: r2modman.flatpak
          manifest-path: flatpak/io.github.ebkr.r2modman.release.yaml
