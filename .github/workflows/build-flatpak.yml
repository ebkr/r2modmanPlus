name: Build Flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Build the Flatpak app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: flatpak
            os: ubuntu-latest
            arch: x86_64
          - kind: flatpak-arm
            os: ubuntu-24.04-arm
            arch: aarch64
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: r2modman.flatpak
          manifest-path: flatpak/io.github.ebkr.r2modman.yaml
          arch: ${{ matrix.arch }}
