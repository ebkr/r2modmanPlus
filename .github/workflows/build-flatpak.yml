name: Build Flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Build the Flatpak app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          log_level: debug

      - name: Install Yarn dependencies
        run: yarn install --immutable

      - name: Generate release manifest
        run: yarn generate-release-manifest

      - name: Generate node sources fresh
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          rm -rf "$UV_CACHE_DIR"
          uvx --from 'git+https://github.com/flatpak/flatpak-builder-tools.git@caca92bc6898ea40d6521b581fef2402ba3b3aae#subdirectory=node' \
            flatpak-node-generator yarn yarn.lock --output flatpak/generated-sources.json

      - name: Build flatpak
        run: yarn build-flatpak