name: Build Flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Build the Flatpak app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          log_level: debug

      - name: Install Yarn dependencies
        run: yarn install --immutable

      - name: Generate release manifest
        run: yarn generate-release-manifest

      - name: Debug flatpak-node-generator build artifacts
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          FBT_COMMIT: caca92bc6898ea40d6521b581fef2402ba3b3aae
        run: |
          set -euxo pipefail

          rm -rf "$UV_CACHE_DIR" /tmp/flatpak-builder-tools /tmp/fbt-venv

          git clone https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools
          git -C /tmp/flatpak-builder-tools checkout "$FBT_COMMIT"

          echo "=== source tree ==="
          grep -n "Only yarn v1 lockfiles are supported" /tmp/flatpak-builder-tools/node/flatpak_node_generator/providers/yarn.py || true
          grep -n "__metadata" /tmp/flatpak-builder-tools/node/flatpak_node_generator/providers/yarn.py || true
          grep -n "cacheKey" /tmp/flatpak-builder-tools/node/flatpak_node_generator/providers/yarn.py || true

          cd /tmp/flatpak-builder-tools/node

          python3 -m venv /tmp/fbt-venv
          . /tmp/fbt-venv/bin/activate

          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

          echo "=== dist contents ==="
          ls -la dist

          python - <<'PY'
          from pathlib import Path
          import zipfile
          import tarfile
          import sys

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if not wheels:
              print("No wheel found", file=sys.stderr)
              sys.exit(1)
          if not sdists:
              print("No sdist found", file=sys.stderr)
              sys.exit(1)

          def inspect_text(label: str, text: str) -> None:
              print(f"=== {label} ===")
              print("old error:", "Only yarn v1 lockfiles are supported" in text)
              print("__metadata:", "__metadata" in text)
              print("cacheKey:", "cacheKey" in text)

          wheel = wheels[0]
          print("wheel:", wheel)
          with zipfile.ZipFile(wheel) as zf:
              matches = [n for n in zf.namelist() if n.endswith("flatpak_node_generator/providers/yarn.py")]
              print("wheel matches:", matches)
              if not matches:
                  print("wheel does not contain providers/yarn.py", file=sys.stderr)
                  sys.exit(1)
              text = zf.read(matches[0]).decode("utf-8")
              inspect_text("wheel yarn.py", text)

          sdist = sdists[0]
          print("sdist:", sdist)
          with tarfile.open(sdist, "r:gz") as tf:
              matches = [n for n in tf.getnames() if n.endswith("flatpak_node_generator/providers/yarn.py")]
              print("sdist matches:", matches)
              if not matches:
                  print("sdist does not contain providers/yarn.py", file=sys.stderr)
                  sys.exit(1)
              extracted = tf.extractfile(matches[0])
              if extracted is None:
                  print("failed to extract yarn.py from sdist", file=sys.stderr)
                  sys.exit(1)
              text = extracted.read().decode("utf-8")
              inspect_text("sdist yarn.py", text)
          PY

      - name: Debug uv-installed flatpak-node-generator
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          FBT_COMMIT: caca92bc6898ea40d6521b581fef2402ba3b3aae
        run: |
          set -euxo pipefail

          rm -rf "$UV_CACHE_DIR"

          uv run --with "git+https://github.com/flatpak/flatpak-builder-tools.git@${FBT_COMMIT}#subdirectory=node" \
            python - <<'PY'
          import flatpak_node_generator.providers.yarn as y
          from pathlib import Path

          p = Path(y.__file__)
          text = p.read_text(encoding="utf-8")

          print("installed file:", p)
          print("old error:", "Only yarn v1 lockfiles are supported" in text)
          print("__metadata:", "__metadata" in text)
          print("cacheKey:", "cacheKey" in text)
          PY

      - name: Build flatpak
        env:
          UV_CACHE_DIR: /tmp/uv-cache
        run: yarn build-flatpak